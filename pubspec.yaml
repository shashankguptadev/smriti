name: smriti
description: "Smriti — Offline Personal Knowledge Base"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5+1

  # Local Vector DB
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2

  # Document Ingestion
  file_picker: ^8.3.7
  syncfusion_flutter_pdf: ^26.2.14
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_edge_ai: ^2.7.2
  flutter_edge_ai_litertlm: ^1.21.2
  url_launcher: ^6.3.3
  google_mlkit_text_recognition: ^1.0.3
  pdfx: ^2.11.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ObjectBox codegen
  build_runner: ^2.4.15
  objectbox_generator: ^5.3.2

flutter:
  uses-material-design: true
